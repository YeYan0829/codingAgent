[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent-runtime"
version = "0.3.0"
description = "Local readonly coding agent runtime prototype."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.0",
  "openai>=1.0",
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codeagent = "codeagent.cli:app"

[tool.setuptools.packages.find]
include = ["codeagent*"]

[tool.setuptools.package-data]
codeagent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
